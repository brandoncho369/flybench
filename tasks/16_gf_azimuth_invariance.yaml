name: gf_azimuth_invariance
title: The giant fiber fires once, wherever the loom comes from
tier: hard
circuit: escape
description: >
  A looming object at −45°, 0° or +45° azimuth evokes the same giant-fiber response: a single
  spike (Ache et al. 2019; von Reyn et al. 2014), with no directional selectivity across azimuth
  (J Exp Biol 2023, DSI never above 0.5, n = 10 flies). This is the first recording-match task:
  the GF spike count is compared to the measured one, not to a convention.
  Stimulus geometry (provenance INFERRED, see docs/rfcs/16_gf_azimuth_invariance.md): the model
  has no eyes, so a loom at −45° drives the left-side LPLC2/LC4 detectors, +45° the right-side
  ones, 0° both, each neuron at the same 150 Hz used by task 4. The mapping uses the `side`
  annotation, not receptive fields; a dataset without side labels skips this task.
  Pre-registered prediction (before the first run): the reference LIF passes "seen" and
  "invariant" and fails "one spike" at every azimuth (~120 spikes per loom in task 13).
citation: "Ache et al. 2019 (Curr Biol 29:1073); von Reyn et al. 2014 (Nat Neurosci 17:962); azimuthal invariance: J Exp Biol 2023 226:jeb244790"
duration_ms: 600
window: [200, 500]
requires_stimuli: [loom_left, loom_right]
readouts:
  gf: {select: {any: [{cell_type: GF}, {cell_type: DNp01}, {hemibrain_type: "Giant Fiber"}, {all_of: [{labels_regex: "giant fib"}, {super_class: descending}]}]}}
conditions:
  left:    # −45°: the left eye sees it
    stimuli:
      - {name: loom_left, select: {all_of: [{any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}, {side_regex: "^(left|l)$"}]}, rate_hz: 150, t_start_ms: 200, t_end_ms: 500}
  right:   # +45°
    stimuli:
      - {name: loom_right, select: {all_of: [{any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}, {side_regex: "^(right|r)$"}]}, rate_hz: 150, t_start_ms: 200, t_end_ms: 500}
  frontal: # 0°: both eyes
    stimuli:
      - {name: loom_left, select: {all_of: [{any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}, {side_regex: "^(left|l)$"}]}, rate_hz: 150, t_start_ms: 200, t_end_ms: 500}
      - {name: loom_right, select: {all_of: [{any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}, {side_regex: "^(right|r)$"}]}, rate_hz: 150, t_start_ms: 200, t_end_ms: 500}
checks:
  # seen: at least one GF spike per neuron at every azimuth
  - {type: spikes_per_neuron, cond: left, readout: gf, op: ">=", value: 1, basis: "von Reyn et al. 2014; J Exp Biol 2023: a loom at −45° evokes a GF response"}
  - {type: spikes_per_neuron, cond: right, readout: gf, op: ">=", value: 1, basis: "von Reyn et al. 2014; J Exp Biol 2023: a loom at +45° evokes a GF response"}
  - {type: spikes_per_neuron, cond: frontal, readout: gf, op: ">=", value: 1, basis: "von Reyn et al. 2014: a frontal loom evokes a GF response"}
  # one spike: the measured count, not a convention (the paper reports a single spike, no spread → threshold rule)
  - {type: spikes_per_neuron, cond: left, readout: gf, op: "<=", value: 1, observed: {mean: 1, sd: unknown, source: "Ache et al. 2019 (Curr Biol 29:1073): one GF spike per looming presentation"}, basis: "Ache et al. 2019: a single GF spike per loom; measured"}
  - {type: spikes_per_neuron, cond: right, readout: gf, op: "<=", value: 1, observed: {mean: 1, sd: unknown, source: "Ache et al. 2019 (Curr Biol 29:1073): one GF spike per looming presentation"}, basis: "Ache et al. 2019: a single GF spike per loom; measured"}
  - {type: spikes_per_neuron, cond: frontal, readout: gf, op: "<=", value: 1, observed: {mean: 1, sd: unknown, source: "Ache et al. 2019 (Curr Biol 29:1073): one GF spike per looming presentation"}, basis: "Ache et al. 2019: a single GF spike per loom; measured"}
  # nothing before the loom
  - {type: spikes_per_neuron, cond: frontal, readout: gf, op: "<", value: 1, window: [0, 200], basis: "convention: no GF spike before the loom begins"}
  # invariance: DSI = (a − b)/(a + b) < 0.5 is a/b < 3 in both directions
  - {type: ratio, cond: left, over: right, readout: gf, op: "<", value: 3, basis: "J Exp Biol 2023 226:jeb244790: no directional-selectivity index across −45°/0°/+45° exceeded 0.5 (n = 10); DSI < 0.5 ⇔ ratio < 3"}
  - {type: ratio, cond: right, over: left, readout: gf, op: "<", value: 3, basis: "J Exp Biol 2023 226:jeb244790: no directional-selectivity index across −45°/0°/+45° exceeded 0.5 (n = 10); DSI < 0.5 ⇔ ratio < 3"}
