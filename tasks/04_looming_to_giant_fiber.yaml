name: looming_to_giant_fiber
title: Looming → giant fiber escape
description: >
  LPLC2 and LC4 are the visual projection neurons that detect an expanding
  (looming) object. They converge on the Giant Fiber, the descending neuron
  that triggers the takeoff escape. Drive the detectors; the GF should fire.
circuit: escape
citation: von Reyn et al. 2014; Ache et al. 2019; Shiu et al. 2024
duration_ms: 600
window: [220, 500]
readout:
  select: {any: [{cell_type: GF}, {cell_type: DNp01}, {hemibrain_type: "Giant Fiber"}, {all_of: [{labels_regex: "giant fib"}, {super_class: descending}]}]}
conditions:
  baseline: {stimuli: []}
  loom:
    stimuli:
      - name: looming_detectors
        select: {any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}
        rate_hz: 150
        t_start_ms: 200
        t_end_ms: 500
checks:
  - {type: rate, cond: loom, op: ">", value: 5, basis: "convention: 5 Hz over the 280 ms window is >1 GF spike per neuron. NOTE the real GF fires a single spike per escape (von Reyn et al. 2014); this check tests that the pathway conducts, task 13 tests the spike count"}
  - {type: ratio, cond: loom, over: baseline, op: ">", value: 5, basis: "convention: a 5x rise over baseline; baseline is ~0 Hz so any real response clears this easily — it exists to fail models whose baseline is already high"}
  - {type: active_fraction, cond: loom, op: "<", value: 0.1, basis: "convention: Shiu et al. 2024 report sparse activity on stimulation; 10% of all neurons is a generous ceiling chosen so a healthy sparse response passes and mass recruitment fails"}
