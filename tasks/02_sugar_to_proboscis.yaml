name: sugar_to_proboscis
title: Sugar → proboscis extension
description: >
  The canonical reflex. Activating sugar-sensing gustatory receptor neurons
  should drive MN9, the motor neuron that extends the proboscis. This is the
  headline result of Shiu et al. 2024 and a behaviour every fly lab can
  reproduce with a drop of sucrose.
  Selector provenance — FlyWire v783: sub_class "sugar/water" (Engert et al. 2022 annotations).
  MaleCNS v1.0: the gustatory companion paper (Cell 2026; bioRxiv 10.1101/2025.08.25.671814)
  classifies labellar bristle GRNs by receptor driver line: LB3b sweet (Gr64f), LB3c sweet + low
  salt (Ir56b), LB3a water (ppk28), LB3d high salt / aversive (Ir7c, ppk23), LB1a–d bitter,
  LB1e amino-acid aversion (glutamatergic). The sugar set is therefore LB3b–c only. Our earlier
  wiring inference (docs/MALECNS.md) had put LB3a and LB3d in the sugar set because they also
  synapse onto the Shiu 2022 second-order sugar neurons; those cells respond to water as well as
  sugar (Shiu et al. 2024), so the wiring was consistent with the labels, not evidence against
  them. Provenance tag: MEASURED (receptor lines), not inferred.
circuit: taste
citation: Dethier 1976; Shiu et al. 2024 (Nature) Fig. 2
duration_ms: 1000
window: [250, 800]
readout:
  select: {any: [{cell_type: MN9}, {cell_type: CB0701}, {hemibrain_type: MN9}, {all_of: [{labels_regex: "\\bMN9\\b"}, {super_class: motor}]}]}
conditions:
  baseline: {stimuli: []}
  sugar:
    stimuli:
      - name: sugar_grn
        select: {any: [{sub_class: "sugar/water"}, {all_of: [{labels_regex: "sugar"}, {super_class: sensory}, {not: {labels_regex: "bitter"}}]}, {all_of: [{sub_class: "labellar bristle"}, {cell_type_regex: "^LB3[bc]$"}]}]}
        rate_hz: 100
        t_start_ms: 200
        t_end_ms: 800
checks:
  - {type: rate, cond: sugar, op: ">", value: 5, basis: "convention: 5 Hz over the window is ~2.5 spikes per neuron, the smallest response that is unambiguously not noise (baseline is 0 Hz)"}
  - {type: ratio, cond: sugar, over: baseline, op: ">", value: 5, basis: "convention: a 5x rise over baseline; baseline is ~0 Hz so any real response clears this easily — it exists to fail models whose baseline is already high"}
  - {type: active_fraction, cond: sugar, op: "<", value: 0.1, basis: "convention: Shiu et al. 2024 report sparse activity on stimulation; 10% of all neurons is a generous ceiling chosen so a healthy sparse response passes and mass recruitment fails"}
