name: crosstalk
title: Taste does not trigger escape; looming does not trigger feeding
tier: hard
description: >
  Negative controls across circuits. Sugar on the labellum should not fire the
  Giant Fiber, and a looming shadow should not extend the proboscis. Both
  circuits pass their own reflex tests in the core tier; this task asks whether
  they stay separate, which fails when the global gain is high enough that
  activity spreads through shared interneurons.
citation: von Reyn et al. 2014; Shiu et al. 2024
duration_ms: 900
window: [250, 800]
readouts:
  mn9: {select: {any: [{cell_type: MN9}, {cell_type: CB0701}, {all_of: [{labels_regex: "\\bMN9\\b"}, {super_class: motor}]}]}}
  gf:  {select: {any: [{cell_type: GF}, {cell_type: DNp01}, {hemibrain_type: "Giant Fiber"}, {all_of: [{labels_regex: "giant fib"}, {super_class: descending}]}]}}
conditions:
  sugar:
    stimuli:
      - {name: sugar_grn, select: {any: [{sub_class: "sugar/water"}, {all_of: [{labels_regex: "sugar"}, {super_class: sensory}, {not: {labels_regex: "bitter"}}]}, {all_of: [{sub_class: "labellar bristle"}, {cell_type_regex: "^LB3[a-d]$"}]}]}, rate_hz: 100, t_start_ms: 200, t_end_ms: 800}
  loom:
    stimuli:
      - {name: looming_detectors, select: {any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}, rate_hz: 150, t_start_ms: 200, t_end_ms: 800}
checks:
  - {type: rate, cond: sugar, readout: mn9, op: ">", value: 5}
  - {type: rate, cond: sugar, readout: gf, op: "<", value: 2}
  - {type: rate, cond: loom, readout: gf, op: ">", value: 5}
  - {type: rate, cond: loom, readout: mn9, op: "<", value: 2}
