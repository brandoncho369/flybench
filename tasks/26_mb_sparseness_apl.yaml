name: mb_sparseness_apl
title: Kenyon cell odour responses are sparse, and less sparse without APL
tier: hard
circuit: olfaction
description: >
  An odour activates only ~5 % of the ~2,000 Kenyon cells per hemisphere (Honegger et al. 2011;
  Turner et al. 2008), and that sparseness is enforced by the single GABAergic APL neuron, which
  reads the whole KC population and inhibits all of it (Lin et al. 2014: blocking APL output with
  shibire increases KC odour responses, lowers population sparseness, raises the overlap between
  odours, and impairs learned discrimination of similar odours). This task drives the task-18
  odour panel (eight glomeruli, each a whole ORN type at 100 Hz) with the mushroom body intact
  and with APL silenced — its outgoing synapses zeroed for the condition (`silence`, the in
  silico shibire; the neuron stays, so its own inputs are untouched). It is the first task to
  use silencing and lists `requires_capabilities: [can_silence]`, so a simulator that cannot
  do it skips the task rather than failing it. Checks: three odours each activate under 20 % of
  KCs with APL intact; silencing APL raises that fraction for the same three; and it lowers the
  population sparseness of the KC response for two. Pre-registered predictions and outcome:
  docs/rfcs/26_mb_sparseness_apl.md.
citation: "Lin et al. 2014 (Nat Neurosci 17:559); Honegger, Campbell & Turner 2011 (J Neurosci 31:11772); Turner, Bazhenov & Laurent 2008 (J Neurophysiol 99:734); Willmore & Tolhurst 2001 (Network 12:255)"
duration_ms: 900
window: [200, 700]
requires_capabilities: [can_silence]
requires_stimuli: [orn_da1, orn_dm4, orn_va1v]
requires_readouts: [kc, apl]
readouts:
  kc:  {select: {cell_type_regex: "^KC"}}
  apl: {select: &apl {any: [{cell_type: APL}, {hemibrain_type: APL}]}}
conditions:
  cva:          {stimuli: [{name: orn_da1, select: {cell_type: ORN_DA1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  cva_apl_off:  {stimuli: [{name: orn_da1, select: {cell_type: ORN_DA1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  dm1:          {stimuli: [{name: orn_dm1, select: {cell_type: ORN_DM1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dm1_apl_off:  {stimuli: [{name: orn_dm1, select: {cell_type: ORN_DM1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  dm2:          {stimuli: [{name: orn_dm2, select: {cell_type: ORN_DM2}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dm2_apl_off:  {stimuli: [{name: orn_dm2, select: {cell_type: ORN_DM2}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  dm4:          {stimuli: [{name: orn_dm4, select: {cell_type: ORN_DM4}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dm4_apl_off:  {stimuli: [{name: orn_dm4, select: {cell_type: ORN_DM4}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  dl1:          {stimuli: [{name: orn_dl1, select: {cell_type: ORN_DL1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dl1_apl_off:  {stimuli: [{name: orn_dl1, select: {cell_type: ORN_DL1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  dl5:          {stimuli: [{name: orn_dl5, select: {cell_type: ORN_DL5}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dl5_apl_off:  {stimuli: [{name: orn_dl5, select: {cell_type: ORN_DL5}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  va1v:         {stimuli: [{name: orn_va1v, select: {cell_type: ORN_VA1v}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  va1v_apl_off: {stimuli: [{name: orn_va1v, select: {cell_type: ORN_VA1v}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
  dc1:          {stimuli: [{name: orn_dc1, select: {cell_type: ORN_DC1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dc1_apl_off:  {stimuli: [{name: orn_dc1, select: {cell_type: ORN_DC1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}], silence: *apl}
checks:
  # sparse with APL: a whole-glomerulus drive still reaches fewer than a fifth of the KCs
  - {type: readout_active_fraction, cond: cva, readout: kc, op: "<", value: 0.2, basis: "Honegger et al. 2011: an odour activates ~5 % of Kenyon cells (population imaging); Turner et al. 2008: ~6 %; 0.2 is a convention loosened for a model whose odour is one whole glomerulus at 100 Hz"}
  - {type: readout_active_fraction, cond: dm4, readout: kc, op: "<", value: 0.2, basis: "Honegger et al. 2011: an odour activates ~5 % of Kenyon cells (population imaging); Turner et al. 2008: ~6 %; 0.2 is a convention loosened for a model whose odour is one whole glomerulus at 100 Hz"}
  - {type: readout_active_fraction, cond: va1v, readout: kc, op: "<", value: 0.2, basis: "Honegger et al. 2011: an odour activates ~5 % of Kenyon cells (population imaging); Turner et al. 2008: ~6 %; 0.2 is a convention loosened for a model whose odour is one whole glomerulus at 100 Hz"}
  # APL silenced: more KCs respond to the same odour
  - {type: ratio, metric: readout_active_fraction, cond: cva_apl_off, over: cva, readout: kc, op: ">", value: 1, basis: "Lin et al. 2014: blocking APL output increases KC odour responses and the fraction of responding KCs (population sparseness falls); > 1 is the task-18 convention for a direction"}
  - {type: ratio, metric: readout_active_fraction, cond: dm4_apl_off, over: dm4, readout: kc, op: ">", value: 1, basis: "Lin et al. 2014: blocking APL output increases KC odour responses and the fraction of responding KCs (population sparseness falls); > 1 is the task-18 convention for a direction"}
  - {type: ratio, metric: readout_active_fraction, cond: va1v_apl_off, over: va1v, readout: kc, op: ">", value: 1, basis: "Lin et al. 2014: blocking APL output increases KC odour responses and the fraction of responding KCs (population sparseness falls); > 1 is the task-18 convention for a direction"}
  # and the response is spread over more of the population
  - {type: ratio, metric: population_sparseness, cond: cva, over: cva_apl_off, readout: kc, op: ">", value: 1, basis: "Lin et al. 2014: APL block decreases the population sparseness of KC odour responses (Willmore & Tolhurst 2001 sparseness across KCs); > 1 is the task-18 convention for a direction"}
  - {type: ratio, metric: population_sparseness, cond: dm4, over: dm4_apl_off, readout: kc, op: ">", value: 1, basis: "Lin et al. 2014: APL block decreases the population sparseness of KC odour responses (Willmore & Tolhurst 2001 sparseness across KCs); > 1 is the task-18 convention for a direction"}
