name: co2_pathway_specificity
title: CO2 reaches its own projection neurons, its extraglomerular channel and the lateral horn; other odours do not
tier: hard
circuit: olfaction
description: >
  CO2 is sensed by the Gr21a/Gr63a neurons of the V glomerulus (ORN_V; Suh et al. 2004) and is
  innately aversive. The V glomerulus has its own projection neurons — a bilateral cholinergic
  PN (PNvbi, FlyWire V_ilPN) that targets the lateral horn on both sides (Lin et al. 2013) —
  and, per bioRxiv 2026.01.05.697655 ("Structural basis of CO2 valence coding"), a second,
  extraglomerular channel: the non-GABAergic local neuron LN23, driven only by ORN_V, relays to
  the multiglomerular PNm1 (M_smPNm1), whose activation "induced strong aversion" and whose
  silencing (via LN23) "fully abolished aversion"; PNvbi's primary target is the lateral horn
  neuron LHPD5c1. This task drives ORN_V at the task-02 100 Hz and reads V_ilPN, LN23, PNm1 and
  LHPD5c1 (four positives), then drives two other glomeruli of the task-18 panel (DA1, DM1) and
  requires PNm1 and V_ilPN to stay silent (three nulls): in the wiring neither receives a
  synapse from any ORN but ORN_V, and PNm1's LN23 input carries only CO2. The nulls test the
  task-18 finding — that this model's antennal lobe broadcasts one glomerulus to most PNs — on
  the one channel the fly keeps private. LHPD5c1 is not a null: it also receives DM1/DM4/DP1m
  PNs directly (the paper: it "integrates CO2 + food cues"). Pre-registered predictions and
  outcome: docs/rfcs/27_co2_pathway_specificity.md.
citation: "bioRxiv 2026.01.05.697655 (Structural basis of CO2 valence coding in Drosophila); Suh et al. 2004 (Nature 431:854); Lin et al. 2013 (Nature 501:81); Jones et al. 2007 (Nature 445:86)"
duration_ms: 900
window: [200, 700]
requires_stimuli: [orn_v, orn_da1, orn_dm1]
requires_readouts: [pnv_bi, ln23, pnm1, lhpd5c1]
readouts:
  pnv_bi:  {select: {cell_type: V_ilPN}}
  ln23:    {select: {cell_type: l2LN23}}
  pnm1:    {select: {cell_type: M_smPNm1}}
  lhpd5c1: {select: {cell_type: LHPD5c1}}
conditions:
  co2: {stimuli: [{name: orn_v,   select: {cell_type: ORN_V},   rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  cva: {stimuli: [{name: orn_da1, select: {cell_type: ORN_DA1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
  dm1: {stimuli: [{name: orn_dm1, select: {cell_type: ORN_DM1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}]}
checks:
  - {type: rate, cond: co2, readout: pnv_bi,  op: ">", value: 5, basis: "Suh et al. 2004; Lin et al. 2013: ORN_V drives the V-glomerulus PNs (5,258 synapses onto the V_ilPN pair in FlyWire v783); 5 Hz is the task-02 convention for a response"}
  - {type: rate, cond: co2, readout: ln23,    op: ">", value: 5, basis: "bioRxiv 2026.01.05.697655: LN23 relays CO2 through an extraglomerular pathway and is necessary for CO2 avoidance (1,771 ORN_V synapses onto the four LN23 in FlyWire); 5 Hz task-02 convention"}
  - {type: rate, cond: co2, readout: pnm1,    op: ">", value: 5, basis: "bioRxiv 2026.01.05.697655: PNm1 is postsynaptic to LN23, receives mostly CO2-channel input, and its activation induces strong aversion; 5 Hz task-02 convention"}
  - {type: rate, cond: co2, readout: lhpd5c1, op: ">", value: 5, basis: "bioRxiv 2026.01.05.697655: LHPD5c1 is the primary lateral-horn target of PNvbi (1,055 synapses from V_ilPN in FlyWire); 5 Hz task-02 convention"}
  - {type: rate, cond: cva, readout: pnm1,    op: "<", value: 2, basis: "null check. bioRxiv 2026.01.05.697655: PNm1's sensory input is the LN23 CO2 channel, and LN23 receives no synapse from any ORN but ORN_V in either connectome; 2 Hz is the task-05 convention for silence"}
  - {type: rate, cond: dm1, readout: pnm1,    op: "<", value: 2, basis: "null check. bioRxiv 2026.01.05.697655: PNm1 is a CO2 channel, not a general odour channel; the same wiring argument as the DA1 null; 2 Hz task-05 convention"}
  - {type: rate, cond: cva, readout: pnv_bi,  op: "<", value: 2, basis: "null check. Suh et al. 2004; Jones et al. 2007: the V glomerulus is the Gr21a/Gr63a channel and its PNs receive no synapse from any other ORN type (0 from ORN_DA1 in either connectome); 2 Hz task-05 convention"}
