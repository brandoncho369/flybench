name: olfactory_sparse_coding
title: One odour channel stays one channel
tier: hard
description: >
  Olfactory receptor neurons of a single glomerulus (DA1, the cVA pheromone
  channel) synapse onto their own projection neurons. Lateral inhibition by
  local neurons keeps the antennal lobe output sparse: driving DA1 ORNs should
  fire DA1 PNs strongly while most PNs of the other ~50 glomeruli stay quiet,
  and the third-order lateral horn should not light up wholesale. A model with
  the wrong excitation/inhibition balance turns one odour into "all odours".
citation: Olsen & Wilson 2008 (Nature); Wilson 2013 (Annu. Rev. Neurosci.); Kohl et al. 2013
duration_ms: 800
window: [250, 700]
readouts:
  da1_pn: {select: {cell_type_regex: "^DA1_(l|v|ad)PN$"}}
  all_pn: {select: {cell_type_regex: "^[A-Z]+[0-9]*[a-z]?(\\+)?_(l|v|ad|lv|il)PN$"}}
conditions:
  baseline: {stimuli: []}
  cva:
    stimuli:
      - {name: da1_orn, select: {cell_type: ORN_DA1}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}
checks:
  - {type: rate, cond: cva, readout: da1_pn, op: ">", value: 10}
  - {type: ratio, cond: cva, over: baseline, readout: da1_pn, op: ">", value: 5}
  - {type: readout_active_fraction, cond: cva, readout: all_pn, op: "<", value: 0.3}
  - {type: active_fraction, cond: cva, op: "<", value: 0.05}
