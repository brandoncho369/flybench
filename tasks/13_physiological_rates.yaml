name: physiological_rates
title: Neurons fire at fly rates, not at their refractory ceiling
tier: hard
circuit: physiology
description: >
  Passing the reflex tasks only requires that a pathway conducts. This task asks whether the
  readouts fire the way the real neurons do. The Giant Fiber produces a single spike per escape
  (von Reyn et al. 2014; Ache et al. 2019: "the timing of a single spike in the GF determines
  whether a fly uses a short or long takeoff"): it should spike once when the loom arrives and be
  silent before. For MN9 no electrophysiological recording exists in the literature (Gordon &
  Scott 2009, Schwarz et al. 2017, McKellar & Simpson 2020 and Shiu et al. 2022 are behaviour,
  optogenetics or calcium imaging), so the MN9 ceiling here is a convention, not a measurement,
  and is labelled as such. The reference LIF model pins both readouts at ~430 Hz — their 2.2 ms
  refractory ceiling — which is a saturating network, not a reflex.
citation: "von Reyn et al. 2014 (Nat Neurosci 17:962); Ache et al. 2019 (Curr Biol 29:1073) — single GF spike per loom. MN9 ceiling: convention (no MN9 electrophysiology published)"
duration_ms: 800
window: [200, 700]
readouts:
  gf:  {select: {any: [{cell_type: GF}, {cell_type: DNp01}, {hemibrain_type: "Giant Fiber"}, {all_of: [{labels_regex: "giant fib"}, {super_class: descending}]}]}}
  mn9: {select: {any: [{cell_type: MN9}, {cell_type: CB0701}, {hemibrain_type: MN9}, {all_of: [{labels_regex: "\\bMN9\\b"}, {super_class: motor}]}]}}
conditions:
  loom:
    stimuli:
      - {name: looming_detectors, select: {any: [{cell_type: LPLC2}, {cell_type: LC4}, {hemibrain_type: LPLC2}, {hemibrain_type: LC4}]}, rate_hz: 150, t_start_ms: 200, t_end_ms: 500}
  sugar:
    stimuli:
      - {name: sugar_grn, select: {any: [{sub_class: "sugar/water"}, {all_of: [{labels_regex: "sugar"}, {super_class: sensory}, {not: {labels_regex: "bitter"}}]}, {all_of: [{sub_class: "labellar bristle"}, {cell_type_regex: "^LB3[bc]$"}]}]}, rate_hz: 100, t_start_ms: 200, t_end_ms: 700}
checks:
  - {type: spikes_per_neuron, cond: loom, readout: gf, op: ">=", value: 1, window: [200, 500], basis: "von Reyn et al. 2014: a looming stimulus evokes a GF spike; at least one per neuron during the loom"}
  - {type: spikes_per_neuron, cond: loom, readout: gf, op: "<=", value: 1, window: [200, 500], basis: "Ache et al. 2019 (Curr Biol 29:1073): a single GF spike per looming presentation decides takeoff type; von Reyn et al. 2014. Measured, not a convention. The reference model fires ~120 in this window"}
  - {type: spikes_per_neuron, cond: loom, readout: gf, op: "<", value: 1, window: [0, 200], basis: "convention: no GF spike before the loom begins"}
  - {type: rate, cond: sugar, readout: mn9, op: ">", value: 5, basis: "convention: the pathway must still conduct (same threshold as task 02)"}
  - {type: rate, cond: sugar, readout: mn9, op: "<", value: 150, basis: "convention: no MN9 electrophysiology exists (Schwarz et al. 2017 and McKellar & Simpson 2020 are optogenetic/kinematic); 150 Hz is a ceiling chosen to sit well below the 430 Hz refractory limit and above any sustained insect motor-neuron rate; revise when a recording is published"}
