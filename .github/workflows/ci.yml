name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,embodied]"    # embodied: FlyGym/MuJoCo so the toy runs task 33 (the body) in CI
      - run: pytest -q
      - run: flybench lint
      - run: flybench validate results/
      - run: flybench run --gain 1.0 --tier core
      - run: pip install nbconvert ipykernel && python -m nbconvert --to notebook --execute notebooks/01_toy.ipynb --output /tmp/01_toy.executed.ipynb --ExecutePreprocessor.timeout=900
