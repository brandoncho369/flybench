# The settings the viral "fly brain in Minecraft" demo (blendi-remade/fly-brain-minecraft) used:
# MaleCNS v1.0 connectome (neuPrint dataset male-cns:v1.0, Janelia FlyEM), Shiu constants,
# global gain 0.65, edges with >= 5 synapses.
#
# To reproduce on the same data (Codex does not serve MaleCNS yet; neuPrint allows anonymous access):
#   flybench fetch-neuprint data-malecns            # ~10-20 min, resumable; writes CSVs in the Codex layout
#   flybench build data-malecns --name malecns
#   flybench run -c malecns --config configs/malecns_minecraft.yaml --seeds 3 --label "MaleCNS gain 0.65 (Minecraft demo)" -o results/malecns-gain-0.65.json
#
# MaleCNS includes the ventral nerve cord (~176k neurons vs 139k for FlyWire brain-only) and is
# annotated by a different team, so some task selectors will match 0 neurons on the male names.
# `flybench select -c malecns '{...}'` finds the right ones; a PR adding male-specific fallbacks
# (the `any:` selector grammar) is welcome. The Beat Saber demo used the same connectome and gain
# with a scripted motor layer; only the brain part is benchmarkable.
w_syn_mv: 0.275
gain: 0.65
