[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybench"
version = "0.2.0"
description = "A reflex benchmark for whole-brain fruit fly (Drosophila) connectome simulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brandon Cho" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
  "jsonschema>=4.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# only to re-render the sensory front-end caches (flybench frontend flyvis render); runs and CI use the committed .npz
flyvis = ["flyvis>=1.2", "torch"]
# the embodied track (flybench.embodied): NeuroMechFly in FlyGym / MuJoCo; a task with a `body:` block is skipped without it
embodied = ["flygym>=2.1; python_version >= '3.12'"]

[project.scripts]
flybench = "flybench.cli:main"

# listed explicitly because the two `_bundled` entries live outside the package directory
[tool.setuptools]
packages = ["flybench", "flybench.models", "flybench.frontends", "flybench.embodied",
            "flybench._bundled.tasks", "flybench._bundled.flyvis"]

# The task files and the committed sensory-front-end caches live at the top level of the repo (that is
# where contributors add them) and are shipped inside the wheel as well, so `pip install flybench` has
# a working suite. flybench.bench.TASK_DIR / flyvis_frontend.CACHE_DIR prefer the repo copy and fall
# back to these (flybench/_bundled/).
[tool.setuptools.package-dir]
"flybench._bundled.tasks" = "tasks"
"flybench._bundled.flyvis" = "data/frontends/flyvis"

[tool.setuptools.package-data]
flybench = ["schema/*.json", "manifests.json"]
"flybench._bundled.tasks" = ["*.yaml"]
"flybench._bundled.flyvis" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
